name: Release

# On tag v<version> (pushed or created via a GitHub release), builds, tests, packs pixclean-<version>.tgz,
# verifies the packed archive, and attaches it to the GitHub release so host apps (pixClean-desktop,
# asset manager) can install it directly without building from source.

on:
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, pack and attach tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Tag '$TAG' does not match package.json version '${PKG_VERSION}' (expected '${EXPECTED_TAG}')." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Run engine unit tests
        run: npm test

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:tests

      - name: Build standalone app and library
        run: |
          npm run build
          npm run build:lib

      - name: Pack tarball
        run: |
          archive="$(npm pack --json --pack-destination "$RUNNER_TEMP" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          echo "ARCHIVE=$RUNNER_TEMP/$archive" >> "$GITHUB_ENV"

      - name: Verify packed archive contents and headless engine
        run: |
          tar -tzf "$ARCHIVE"
          for required in \
            package/dist-lib/index.js \
            package/dist-lib/index.d.ts \
            package/dist-lib/engine.js \
            package/dist-lib/engine/index.d.ts \
            package/dist-lib/pixclean.css; do
            tar -tzf "$ARCHIVE" | grep -qx "$required" || { echo "Missing $required in tarball" >&2; exit 1; }
          done
          TEST_DIR="$RUNNER_TEMP/pkg-check"
          mkdir -p "$TEST_DIR"
          tar -xzf "$ARCHIVE" -C "$TEST_DIR"
          node -e "
            import('$TEST_DIR/package/dist-lib/engine.js').then((engine) => {
              const buf = engine.createPixelBuffer(16, 16);
              const res = engine.processPixelArt(buf, engine.DEFAULT_PROCESS_OPTIONS);
              if (res.gridWidth !== 2 || res.gridHeight !== 2) throw new Error('Invalid grid output');
              console.log('Packed pixclean/engine verified OK');
            });
          "

      - name: Attach tarball to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" "$ARCHIVE" \
              --verify-tag \
              --title "pixClean ${TAG#v}" \
              --generate-notes \
              "${prerelease[@]}"
          fi
