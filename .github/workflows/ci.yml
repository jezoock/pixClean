name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run engine unit tests
        run: npm test

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Build standalone application
        run: npm run build

      - name: Build multi-entry library & declarations
        run: npm run build:lib

      - name: Verify headless engine bundle runs in pure Node (zero DOM)
        run: |
          node -e "
            import('./dist-lib/engine.js').then((engine) => {
              const buf = engine.createPixelBuffer(16, 16);
              const res = engine.processPixelArt(buf, engine.DEFAULT_PROCESS_OPTIONS);
              if (res.gridWidth !== 2 || res.gridHeight !== 2) {
                throw new Error('Unexpected grid dimensions from dist-lib/engine.js');
              }
              console.log('dist-lib/engine.js OK:', Object.keys(engine).length, 'exports');
            });
          "
